<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Admin review | Treasure Valley Mental Health Guide</title>
  <link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="align-theme.css"><link rel="stylesheet" href="warm-theme.css">
</head>
<body class="warm-site portal-page">
  <header class="align-header"><div class="shell align-nav-shell"><a class="align-brand" href="index.html"><span class="align-brand-mark" aria-hidden="true">TV</span><span class="align-brand-copy"><strong>Treasure Valley</strong><small>Mental Health Guide</small></span></a><a class="gentle-link" href="index.html">View guide</a></div></header>
  <main class="portal-main admin-main"><div class="portal-heading"><div><div class="eyebrow">Administrator</div><h1>Review provider submissions</h1><p class="portal-lead">Approve complete listings before they appear in the public guide.</p></div><button id="signOut" class="button secondary" type="button">Sign out</button></div>
    <p id="adminMessage" class="profile-message" role="status" aria-live="polite"></p>
    <section class="admin-layout"><aside class="admin-list"><div class="admin-list-heading"><h2>Needs review</h2><span id="submissionCount" class="status-pill">0</span></div><div id="submissionList" class="submission-list"><p class="muted">Loading submissions…</p></div></aside>
      <section class="admin-detail"><div id="emptyReview" class="empty-review"><h2>Select a submission</h2><p>Submitted provider profiles will appear here for review.</p></div><article id="reviewCard" class="review-card" hidden><div class="review-card-heading"><div><div class="eyebrow">Provider submission</div><h2 id="reviewName"></h2><p id="reviewPractice" class="muted"></p></div><span id="reviewStatus" class="status-pill"></span></div><div id="reviewFields" class="review-fields"></div><div class="review-actions"><button id="requestChanges" class="button secondary" type="button">Request changes</button><button id="approveProfile" class="button primary" type="button">Approve and publish</button></div></article></section>
    </section>
  </main>
  <script src="supabase-config.js"></script><script type="module" src="admin.js"></script>
</body></html>
